[project]
name = "cowpoke"
version = "0.2.0"
description = "Read, write and follow every Cowpoke tag from Python, in real time"
requires-python = ">=3.9"
dependencies = ["websockets>=12"]
license = { text = "See the Cowpoke repository" }

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7"]

[project.entry-points.pytest11]
cowpoke = "cowpoke.testing"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
