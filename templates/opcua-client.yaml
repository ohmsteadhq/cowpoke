# Read and write a real OPC UA server's nodes.
id: ua-line1
name: Line 1 OPC UA
kind: opcua
mode: client
# agent: plant-1          # run this service on an edge agent instead of the hub
settings:
  url: opc.tcp://192.168.1.60:4840/
  security_policy: none        # none | basic256sha256 | aes128_sha256_rsa_oaep | aes256_sha256_rsa_pss
  security_mode: none          # none | sign | sign_and_encrypt
  # username: operator
  # password: secret
  trust_server_certs: false    # false: trust the server's cert from the service's certificate list
  poll_ms: 1000
tags:
  - name: temperature
    datatype: float64
    node_id: "ns=2;s=Line1.Temperature"
    writable: false
  - name: speed_sp
    datatype: float32
    node_id: "ns=2;i=1002"
